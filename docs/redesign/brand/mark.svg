<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="400" height="140">
  <title>Mark — orange sphere, 3 variants (A cut / B shade / C orbit)</title>
  <!-- A: flat cut — sphere with a 12% flat slice bottom-right (ping-pong ball resting) -->
  <g transform="translate(20,20)">
    <clipPath id="cutA"><circle cx="50" cy="50" r="50"/></clipPath>
    <g clip-path="url(#cutA)">
      <circle cx="50" cy="50" r="50" fill="#FF5C00"/>
      <rect x="62" y="62" width="60" height="60" transform="rotate(45 62 62)" fill="#14110D"/>
    </g>
    <text x="50" y="128" font-family="Inter, system-ui" font-size="11" text-anchor="middle" fill="#8A857D">A · cut</text>
  </g>
  <!-- B: shade — inner darker crescent gives volume (sphere) -->
  <g transform="translate(150,20)">
    <clipPath id="shB"><circle cx="50" cy="50" r="50"/></clipPath><circle cx="50" cy="50" r="50" fill="#E04E00" clip-path="url(#shB)"/><circle cx="42" cy="42" r="46" fill="#FF5C00" clip-path="url(#shB)"/>
    <text x="50" y="128" font-family="Inter, system-ui" font-size="11" text-anchor="middle" fill="#8A857D">B · shade</text>
  </g>
  <!-- C: orbit — solid sphere + thin ring offset (motion / system) -->
  <g transform="translate(280,20)">
    <circle cx="50" cy="50" r="38" fill="#FF5C00"/>
    <ellipse cx="50" cy="50" rx="50" ry="16" fill="none" stroke="#14110D" stroke-width="5" transform="rotate(-24 50 50)"/>
    <text x="50" y="128" font-family="Inter, system-ui" font-size="11" text-anchor="middle" fill="#8A857D">C · orbit</text>
  </g>
</svg>
